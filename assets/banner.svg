<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7DF1E" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF1E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F7DF1E" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(400%); }
      }
      .anim-glow1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-glow2 {
        animation: pulseGlow 9s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .anim-flow {
        stroke-dasharray: 8 12;
        animation: flowDash 15s linear infinite;
      }
      .anim-pill1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-pill2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .anim-pill3 {
        animation: floatSlow 8s ease-in-out infinite reverse;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Blobs in Deep Background -->
  <g filter="url(#blurFilter)">
    <circle class="anim-glow1" cx="220" cy="110" r="140" fill="url(#glowGrad1)" />
    <circle class="anim-glow2" cx="980" cy="240" r="160" fill="url(#glowGrad2)" />
    <circle class="anim-glow1" cx="620" cy="300" r="120" fill="#22c55e" opacity="0.12" />
  </g>

  <!-- Decorative Matrix / Circuit Lines (Dynamic Motion) -->
  <g opacity="0.35">
    <path class="anim-flow" d="M 0,90 Q 300,140 600,90 T 1200,90" fill="none" stroke="#F7DF1E" stroke-width="1.5" />
    <path class="anim-flow" d="M 0,270 Q 350,210 700,270 T 1200,260" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="200" y1="0" x2="200" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
  </g>

  <!-- Background Animated Badges / Pills (Layered safely behind/around main typography) -->
  <!-- Left Side Badges -->
  <g class="anim-pill1" transform="translate(60, 50)" filter="url(#pillShadow)">
    <rect width="105" height="34" rx="17" fill="url(#pillGrad)" stroke="#F7DF1E" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#F7DF1E" />
    <text x="34" y="22" fill="#f8fafc" class="tag-text">nvm</text>
  </g>

  <g class="anim-pill2" transform="translate(70, 260)" filter="url(#pillShadow)">
    <rect width="115" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="34" y="22" fill="#f8fafc" class="tag-text">mise-en</text>
  </g>

  <!-- Right Side Badges -->
  <g class="anim-pill3" transform="translate(1040, 60)" filter="url(#pillShadow)">
    <rect width="100" height="34" rx="17" fill="url(#pillGrad)" stroke="#fb923c" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#fb923c" />
    <text x="34" y="22" fill="#f8fafc" class="tag-text">fnm ⚡</text>
  </g>

  <g class="anim-pill1" transform="translate(1025, 255)" filter="url(#pillShadow)">
    <rect width="115" height="34" rx="17" fill="url(#pillGrad)" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#4ade80" />
    <text x="34" y="22" fill="#f8fafc" class="tag-text">asdf-vm</text>
  </g>

  <!-- Center Branding (Foreground: High Contrast, Sharp, Unobstructed) -->
  <!-- Category Pill Top -->
  <g transform="translate(485, 38)">
    <rect width="230" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="115" y="20" text-anchor="middle" fill="#38bdf8" class="tag-text">⚡ RUNTIME VERSION CONTROL</text>
  </g>

  <!-- JS Icon Symbol -->
  <g transform="translate(576, 82)">
    <rect width="48" height="48" rx="8" fill="#F7DF1E" />
    <text x="24" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="26" fill="#000000">JS</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="180" text-anchor="middle" class="title-text" fill="url(#titleGrad)">Awesome JavaScript Version Managers</text>

  <!-- Subtitle -->
  <text x="600" y="218" text-anchor="middle" class="sub-text" fill="url(#subGrad)">
    Curated Hub of Open-Source Tools &amp; Cloud Workspaces for Node.js, Deno &amp; Bun
  </text>

  <!-- Meta Badges in Header Foreground -->
  <g transform="translate(365, 254)">
    <rect width="145" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="72" y="19" text-anchor="middle" fill="#94a3b8" class="tag-text">🚀 Zero Version Drift</text>

    <rect x="160" y="0" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="235" y="19" text-anchor="middle" fill="#94a3b8" class="tag-text">📦 Toolchain Pinning</text>

    <rect x="325" y="0" width="145" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="397" y="19" text-anchor="middle" fill="#94a3b8" class="tag-text">🌐 Polyglot &amp; POSIX</text>
  </g>

  <!-- Subtle Border Ring -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
